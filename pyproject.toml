[project]
name = "mt5-journal"
version = "0.0.0"
description = "Automated trading journal for MetaTrader 5 (single user, local-only)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "siliconmetatrader5",
    "MetaTrader5; sys_platform == 'win32'",
    "pandas",
    "mplfinance",
    "typer",
    "fastapi",
    "uvicorn",
    "scikit-learn",
    "lightgbm",
]

[project.scripts]
journal = "journal.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "watchfiles>=1.2.0",
    "httpx",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes + pycodestyle's error classes + bugbear: rules that find bugs, not
# style. Pinned here so a machine-wide ruff config cannot change the verdict.
select = ["F", "E4", "E7", "E9", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer declare parameters with calls in defaults; that is their API.
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument",
    "journal.render.chart.RenderOpts",   # a frozen dataclass
]

[tool.ruff.lint.per-file-ignores]
# OHLC tuples name the low `l`; test modules import per section on purpose and
# write fixture rows compactly, several statements to a line.
"tests/*" = ["E741", "E402", "E702"]

[tool.mypy]
python_version = "3.12"
files = ["src/journal"]
# mplfinance, siliconmetatrader5, lightgbm, joblib and friends ship no stubs.
ignore_missing_imports = true

# Baseline, 2026-10-06: 96 errors, almost all one shape — an Optional field on
# an adapter dataclass (Deal.time_msc, Candle.time_msc, ...) that is validated
# in one function and used in another, which mypy cannot follow. Fixing them
# means tightening the adapter types, and reconstruct.py is read-before-edit
# territory (docs/mt5-deal-model.md). Every other module is checked; shrink
# this list, never grow it.
[[tool.mypy.overrides]]
module = [
    "journal.cli",
    "journal.domain.reconstruct",
    "journal.web.paper",
    "journal.web.training",
]
ignore_errors = true
