[project]
name = "mt5-journal"
version = "0.0.0"
description = "Automated trading journal for MetaTrader 5 (single user, local-only)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "siliconmetatrader5",
    "pandas",
    "mplfinance",
    "typer",
    "fastapi",
    "jinja2",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
journal = "journal.cli:app"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal"]
