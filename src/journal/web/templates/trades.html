{% extends "base.html" %}
{% block title %}Trades — mt5-journal{% endblock %}
{% block content %}
<h1>Trades <span class="muted mono">({{ trades | length }})</span></h1>

{# Filter chips replace the bare <select>s: plain links (work without JS) that
   navigate to the same ?symbol=&status=&source= URLs the route already reads.
   The other two dimensions are preserved on every chip. #}
{% set f = filters %}
<div class="chips spacer" role="navigation" aria-label="filter trades">
  <div class="chip-group">
    <span class="glabel">Symbol</span>
    <a class="chip {{ 'active' if not f.symbol }}" href="/trades?symbol=&status={{ f.status }}&source={{ f.source }}">semua</a>
    {% for s in symbols %}
    <a class="chip {{ 'active' if f.symbol == s }}" href="/trades?symbol={{ s }}&status={{ f.status }}&source={{ f.source }}">{{ s }}</a>
    {% endfor %}
  </div>
  <div class="chip-group">
    <span class="glabel">Status</span>
    <a class="chip {{ 'active' if not f.status }}" href="/trades?symbol={{ f.symbol }}&status=&source={{ f.source }}">semua</a>
    {% for s in ['closed', 'open', 'partially_open'] %}
    <a class="chip {{ 'active' if f.status == s }}" href="/trades?symbol={{ f.symbol }}&status={{ s }}&source={{ f.source }}">{{ s }}</a>
    {% endfor %}
  </div>
  <div class="chip-group">
    <span class="glabel">Source</span>
    <a class="chip {{ 'active' if not f.source }}" href="/trades?symbol={{ f.symbol }}&status={{ f.status }}&source=">semua</a>
    <a class="chip {{ 'active' if f.source == 'ea' }}" href="/trades?symbol={{ f.symbol }}&status={{ f.status }}&source=ea">EA</a>
    <a class="chip {{ 'active' if f.source == 'disc' }}" href="/trades?symbol={{ f.symbol }}&status={{ f.status }}&source=disc">Discretionary</a>
  </div>
</div>

<div class="table-wrap spacer">
<table>
  <thead>
    <tr>
      <th>Dibuka (WIB)</th><th>Symbol</th><th>Arah</th><th>Status</th>
      <th>Source</th><th>Durasi</th><th class="num">Net</th><th></th><th class="num">R</th><th>Tags</th>
    </tr>
  </thead>
  <tbody>
    {% for t in trades %}
    {% set net = t.net_profit %}
    {% set w = ((net | abs) / max_abs_net * 100) if (net is not none and max_abs_net > 0) else 0 %}
    {% set dsec = t.duration_s if t.duration_s is not none else ((t.close_time_msc - t.open_time_msc) // 1000 if t.close_time_msc else none) %}
    <tr>
      <td><a href="/trades/{{ t.position_id }}">{{ t.open_time_msc | wib(header.offset_s) }}</a></td>
      <td>{{ t.symbol_base }}</td>
      <td><span class="badge">{{ t.direction }}</span></td>
      <td>{{ t.status }}</td>
      <td><span class="badge">{{ 'EA' if t.magic else 'Disc' }}</span></td>
      <td class="mono">{{ dsec | dur }}</td>
      <td class="num {{ 'pos' if net and net > 0 else ('neg' if net and net < 0 else '') }}">
        {{ net | money(header.currency, sign=True) }}
      </td>
      <td>
        <span class="spark" aria-hidden="true"
              title="{{ net | money(header.currency, sign=True) }} — panjang relatif thd |net| terbesar di halaman ini">
          <span class="b l" style="width: {{ (w | round) if (net is not none and net < 0) else 0 }}%"></span>
          <span class="b r" style="width: {{ (w | round) if (net is not none and net > 0) else 0 }}%"></span>
        </span>
      </td>
      <td class="num">
        {% if t.r_multiple is none %}<span class="na" title="R perlu SL awal diketahui — belum untuk trade ini">n/a</span>
        {% else %}{{ t.r_multiple | rmult }}{% endif %}
      </td>
      <td>
        {% for tag, source in tags.get(t.position_id, []) %}
        <span class="chip {{ source }} tag">{{ tag }}</span>
        {% endfor %}
      </td>
    </tr>
    {% else %}
    <tr><td colspan="10" class="muted">Tidak ada trade untuk filter ini.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
<p class="note">Net dalam {{ header.currency }} (US cents di akun ini) — warna &amp; bar hanya penanda arah, kode mata uang tetap menempel pada angka. Waktu WIB (UTC+7), dikonversi saat display.</p>
{% endblock %}
