<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mt5-journal{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <span class="brand">mt5-journal</span>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/report">Report</a>
      <a href="/trades">Trades</a>
      <a href="/weekly">Weekly</a>
      <a href="/live">Live</a>
      <a href="/live/commands">Commands</a>
    </nav>
    {% if header %}
    <span class="acct">akun <code>{{ header.login }}</code> · <code>{{ header.currency }}</code></span>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
